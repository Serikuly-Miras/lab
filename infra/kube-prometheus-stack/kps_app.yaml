apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-prometheus-stack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
  sources:
    - repoURL: https://github.com/Serikuly-Miras/lab.git
      ref: repo
    - repoURL: https://github.com/Serikuly-Miras/lab.git
      path: infra/kube-prometheus-stack/custom-resources
    - repoURL: https://github.com/Serikuly-Miras/lab.git
      path: helm_charts/kube-prometheus-stack
      helm:
        valueFiles:
          - $repo/infra/kube-prometheus-stack/values.yaml
