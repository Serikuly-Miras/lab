apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
  sources:
    - repoURL: https://github.com/Serikuly-Miras/lab.git
      path: helm_charts/vault
      targetRevision: HEAD
      helm:
        values: |
          server:
            httproute:
              enabled: true
              parentRefs:
                - name: traefik-gateway
                  group: gateway.networking.k8s.io
                  kind: Gateway
                  namespace: kube-system
                  sectionName: websecure
              hostnames:
                - vault.lab.s-miras.com
            dataStorage:
              enabled: false
            extraArgs: "-config=/vault/userconfig/vault-storage-config/config.hcl"
            volumes:
              - name: userconfig-vault-storage-config
                secret:
                  secretName: vault-storage-config
                  defaultMode: 420
            volumeMounts:
              - name: userconfig-vault-storage-config
                mountPath: /vault/userconfig/vault-storage-config
                readOnly: true
    - repoURL: https://github.com/Serikuly-Miras/lab.git
      targetRevision: HEAD
      path: infra/vault/custom-resources
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: vault
      namespace: vault
      jsonPointers:
        - /spec/parentRefs
      jqPathExpressions:
        - .spec.rules[].backendRefs[].group
        - .spec.rules[].backendRefs[].kind
        - .spec.rules[].backendRefs[].weight

