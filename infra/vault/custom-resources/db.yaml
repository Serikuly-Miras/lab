apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vault-cnpg-db
spec:
  instances: 1
  storage:
    size: 10Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: vault
      owner: vault
      secret:
        name: vault-db-credentials
  imagePullPolicy: IfNotPresent
